name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 
      
      - uses: actions/python@v5
        with:
          python-version: "3.12"
        
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
        env:
          DATABASE_URL: ${{ secret.DATABASE_URL}}
